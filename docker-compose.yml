version: '3.8'

services:
  aoc-bot:
    build: .
    container_name: aoc-slack-bot
    restart: unless-stopped

    # Environment variables from .env file
    env_file:
      - .env

    # Persist database between restarts
    volumes:
      - ./data:/app/data

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
